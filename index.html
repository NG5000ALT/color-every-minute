<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time, in Color</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Time, in Color</h1>
    <p>The background changes every minute.</p>

    <button id="colorButton" type="button">
      Change Color
    </button>

    <input
      type="range"
      id="brightnessSlider"
      min="30"
      max="80"
      value="60"
    />
  </main>

  <script src="script.js" defer></script>
</body>
</html>
